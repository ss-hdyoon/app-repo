# Stage-Release: copy the source into /mnt/efs/releases/<RELEASE_ID>/. Not live yet.
version: 0.2
phases:
  install:
    commands:
      - command -v rsync || dnf install -y rsync
  build:
    commands:
      - test -n "$RELEASE_ID"
      - mkdir -p /mnt/efs/releases/$RELEASE_ID
      - rsync -a --delete --exclude .git ./ /mnt/efs/releases/$RELEASE_ID/
      - echo "staged releases/$RELEASE_ID"
